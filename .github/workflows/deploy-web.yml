name: Deploy web (FTP)

# Compila la consola y la sube por FTPS a Hostinger (central.axzy.dev) al
# llegar a main, o a mano desde Actions. Requiere en el repo:
#   Secretos:  FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
#   Variables: VITE_API_URL  (URL pública del API, p. ej. https://…/api/v1)
#              FTP_SERVER_DIR (opcional, carpeta destino; default public_html/)
# La URL del API se fija al compilar: si cambia, se vuelve a desplegar.

on:
  push:
    branches: [main]
    paths: ["web/**", "pnpm-lock.yaml", ".github/workflows/deploy-web.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Comprobar VITE_API_URL
        run: |
          if [ -z "${VITE_API_URL}" ]; then
            echo "Falta la variable VITE_API_URL en el repo (Settings → Variables)."
            exit 1
          fi
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - name: Compilar web
        run: pnpm --filter axzy-central-web run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - name: Subir por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: web/dist/
          server-dir: ${{ vars.FTP_SERVER_DIR || 'public_html/' }}
